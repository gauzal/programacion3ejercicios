# Para correr servidores: 
# > docker compose up -d
services:      
  nginx:
    image: nginx:1.24
    container_name: nginx_paginaWeb
    ports:
      - "80:80"
    volumes:
      - ./configNginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/html      
    depends_on:      
      - db

  db:
    image: mysql:8.4.2
    container_name: db_paginaWeb
    environment:
      MYSQL_ROOT_PASSWORD: admin1234
      MYSQL_DATABASE: datos
      MYSQL_USER: prog3
      MYSQL_PASSWORD: admin123
    volumes:
      - ./baseDatosWeb:/var/lib/mysql
      - ./clientes.sql:/docker-entrypoint-initdb.d/clientes.sql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.1.1
    container_name: phpmyadmin_paginaWeb
    environment:
      PMA_HOST: db
      PMA_USER: prog3
      PMA_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - db

  backend:
    image: node:20-alpine
    container_name: node-backend_paginaWeb
    working_dir: /usr/src/app
    volumes:
      - ./api:/usr/src/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    depends_on:
      - db